# ==============================================================================
# MediAssist-AI Production Nginx Reverse Proxy & SSL Gateway (Milestone 7)
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with upstream response time & cache status
    log_format mediassist_combined '$remote_addr - $remote_user [$time_local] "$request" '
                                   '$status $body_bytes_sent "$http_referer" '
                                   '"$http_user_agent" "$http_x_forwarded_for" '
                                   'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log mediassist_combined;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M; # Support high-resolution medical scan uploads

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Distributed Rate Limiting Zones (Zero-Trust Anti-Abuse)
    # 1. Login zone: 5 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # 2. General API zone: 50 requests per second per IP with burst
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=50r/s;

    # Upstream Services
    upstream backend_service {
        server backend:5001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_service {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # HTTP Server: Redirect HTTP to HTTPS in production, or serve directly if SSL not enabled
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Healthcheck endpoint for Load Balancers (AWS ALB / Cloudflare / K8s)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # Redirect all HTTP traffic to HTTPS (Port 443)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Production Gateway
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL Certificates (Auto-mounted from docker volume or fallback self-signed)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Modern SSL Protocols & Ciphers (Mozilla Modern Profile)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Enterprise Security Headers (Defense in Depth)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        # 1. Auth Endpoint with Anti-Brute-Force Rate Limiting
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Spring Boot 3.4 REST APIs
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for Multimodal AI OCR & LLM Triage
            proxy_connect_timeout 15s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # 3. Google OAuth 2.0 Social Sign-In Handshake
        location ~ ^/(oauth2/|login/oauth2/) {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. OpenAPI / Swagger Documentation
        location ~ ^/(swagger-ui|api/docs|v3/api-docs) {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Frontend Single Page App (React 19)
        location / {
            proxy_pass http://frontend_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
