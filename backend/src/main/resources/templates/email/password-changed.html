<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:replace="~{email/_layout :: layout(~{::mailContent})}">
<body>
<div th:fragment="mailContent">
    <p>Xin chào <strong th:text="${recipientName}">bạn</strong>,</p>
    <p>Mật khẩu tài khoản MediAssist AI của bạn vừa được thay đổi lúc
        <strong th:text="${changedAt}">08:00 01/01/2026</strong>.</p>
    <p>Nếu chính bạn thực hiện thay đổi này, bạn không cần làm gì thêm.</p>
    <p style="color:#b91c1c;"><strong>Nếu không phải bạn</strong>, hãy đặt lại mật khẩu ngay và liên hệ quản trị viên để bảo vệ hồ sơ sức khỏe của bạn.</p>
    <p style="text-align:center;margin:24px 0;">
        <a th:replace="~{email/_parts :: button(${forgotPasswordUrl}, 'Đặt lại mật khẩu')}">Đặt lại mật khẩu</a>
    </p>
</div>
</body>
</html>
