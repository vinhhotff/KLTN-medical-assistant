<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:replace="~{email/_layout :: layout(~{::mailContent})}">
<body>
<div th:fragment="mailContent">
    <p>Xin chào <strong th:text="${recipientName}">bạn</strong>,</p>
    <p th:if="${followUp}">Bác sĩ đã đặt cho bạn một lịch tái khám với thông tin như sau:</p>
    <p th:unless="${followUp}">Lịch hẹn khám của bạn đã được ghi nhận thành công:</p>
    <table role="presentation" cellpadding="0" cellspacing="0" style="margin:16px 0;font-size:14px;">
        <tr th:replace="~{email/_parts :: row('Mã lịch hẹn', ${appointmentCode})}"></tr>
        <tr th:replace="~{email/_parts :: row('Thời gian', ${scheduledTime})}"></tr>
        <tr th:replace="~{email/_parts :: row('Bác sĩ', ${doctorName})}"></tr>
        <th:block th:if="${specialtyName}"><tr th:replace="~{email/_parts :: row('Chuyên khoa', ${specialtyName})}"></tr></th:block>
        <th:block th:if="${clinicRoom}"><tr th:replace="~{email/_parts :: row('Phòng khám', ${clinicRoom})}"></tr></th:block>
    </table>
    <p>Vui lòng có mặt trước giờ hẹn 15 phút. Bạn có thể xem chi tiết, thanh toán hoặc đổi lịch sau khi đăng nhập.</p>
    <p style="text-align:center;margin:24px 0;">
        <a th:replace="~{email/_parts :: button(${portalUrl}, 'Xem lịch hẹn')}">Xem lịch hẹn</a>
    </p>
</div>
</body>
</html>
