# ===================================================================
# MediAssist-AI DEVELOPMENT Profile Configuration (dev)
# ===================================================================

# PostgreSQL Database (Local Docker on port 5433 to avoid conflict with native host postgres)
spring.datasource.url=jdbc:postgresql://localhost:5433/mediassist_db
spring.datasource.username=postgres
spring.datasource.password=postgres_secure_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Dev Sized)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Cache (Local Docker: docker compose up -d)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000

# Security & CORS (Permissive for Local React Vite on 5173)
app.jwt.secret=dev_super_secret_jwt_key_mediassist_telehealth_platform_2026_very_long_secure_string_needs_256_bits!
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging Level
logging.level.root=INFO
logging.level.com.mediassist=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# OpenRouter Free-Tier AI Gateway Configuration
app.ai.openrouter.base-url=https://openrouter.ai/api/v1
app.ai.openrouter.api-key=${OPENROUTER_API_KEY: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}
app.ai.openrouter.models=inclusionai/ling-3.0-flash-sante:free,nex-agi/nex-n2.5-mini:free,openrouter/free,liquid/lfm-2.5-2.6b:free,inclusionai/ling-3.0-flash-vl:free
app.ai.openrouter.enabled=true

# File Upload Size Restrictions (Anti-Storage Exhaustion & PDF Decompression Bomb Protection)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.max-file-size-bytes=10485760
