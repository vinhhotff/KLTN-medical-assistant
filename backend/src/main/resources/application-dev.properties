# ===================================================================
# MediAssist-AI DEVELOPMENT Profile Configuration (dev)
# ===================================================================
server.port=5001

# Java 21 Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true

# ===================================================================
# Google OAuth2 Client Configuration (Spring Security OAuth2 Login)
# ===================================================================
# IMPORTANT: Điền giá trị thực vào file .env hoặc biến môi trường:
#   GOOGLE_CLIENT_ID và GOOGLE_CLIENT_SECRET từ Google Cloud Console
#   Authorized redirect URI phải được đăng ký: http://localhost:5000/login/oauth2/code/google
# ===================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id-here}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret-here}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

# Frontend redirect URL after OAuth2 success/failure
app.oauth2.success-redirect-uri=http://localhost:5173/oauth2/callback
app.oauth2.failure-redirect-uri=http://localhost:5173/login?error=oauth2_failed

# PostgreSQL Database (Local Docker on port 5433 to avoid conflict with native host postgres)
spring.datasource.url=jdbc:postgresql://localhost:5433/mediassist_db
spring.datasource.username=postgres
spring.datasource.password=postgres_secure_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Dev Sized)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Cache (Local Docker: docker compose up -d)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000

# Security & CORS (Permissive for Local React Vite on 5173)
app.jwt.secret=dev_super_secret_jwt_key_mediassist_telehealth_platform_2026_very_long_secure_string_needs_256_bits!
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging Level
logging.level.root=INFO
logging.level.com.mediassist=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Google Gemini Direct AI Gateway Configuration (Priority 1)
app.ai.gemini.enabled=true
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=gemini-3.6-flash
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# OpenRouter Free-Tier AI Gateway Configuration (Priority 2 Fallback)
app.ai.openrouter.base-url=https://openrouter.ai/api/v1
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.models=inclusionai/ling-3.0-flash-sante:free,nex-agi/nex-n2.5-mini:free,openrouter/free
app.ai.openrouter.vision-models=inclusionai/ling-3.0-flash-vl:free,nex-agi/nex-n2.5-pro:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
app.ai.openrouter.enabled=true

# Multi-Page Medical PDF Scanning (Up to 10 pages)
app.pdf.max-pages=10

# File Upload Size Restrictions (Anti-Storage Exhaustion & PDF Decompression Bomb Protection)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.max-file-size-bytes=10485760

