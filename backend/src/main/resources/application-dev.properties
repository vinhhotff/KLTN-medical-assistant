# PostgreSQL Database (Local Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/mediassist_db
spring.datasource.username=postgres
spring.datasource.password=postgres_secure_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Dev Sized)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Cache (Local Docker)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000

# Security & CORS (Permissive for Local React Vite on 5173)
app.jwt.secret=dev_super_secret_jwt_key_mediassist_telehealth_platform_2026_very_long_secure_string_needs_256_bits!
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging Level
logging.level.root=INFO
logging.level.com.mediassist=DEBUG
logging.level.org.hibernate.SQL=DEBUG
