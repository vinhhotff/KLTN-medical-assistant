# ===================================================================
# MediAssist-AI PRODUCTION Profile Configuration (prod)
# ===================================================================

# PostgreSQL Database (Inject via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/mediassist_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Enterprise High-Load Tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:25}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate / JPA (Strict Enterprise Mode: NEVER auto-alter schema in prod)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis Cluster / Single Node
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000

# Security & CORS (Strict Domain Lockdown)
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CLIENT_URL:https://mediassist.fpt.edu.vn}

# Logging Level (High Performance JSON / Info)
logging.level.root=WARN
logging.level.com.mediassist=INFO
logging.level.org.springframework.security=WARN
