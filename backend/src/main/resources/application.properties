# ===================================================================
# MediAssist-AI Master Application Configuration
# ===================================================================
spring.application.name=mediassist-backend

# Default active profile (Can be overridden via -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=dev

# Server Configuration
server.port=${SERVER_PORT:5001}
server.servlet.context-path=/

# Java 21 Virtual Threads (Project Loom) for high-throughput I/O resilience
spring.threads.virtual.enabled=true

# Graceful Shutdown (Zero-Downtime Resilience)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Actuator Health Probes for Docker & Kubernetes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# SpringDoc OpenAPI (Swagger UI)
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# Default JWT expiration
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Seed Admin Defaults
app.seed.admin.email=admin@mediassist.local
app.seed.admin.password=Admin@SecurePass2026!
app.seed.admin.name=System Administrator

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.table=flyway_schema_history

# Supabase Cloud Storage Configuration (Resilient Dual-Tier)
supabase.url=${SUPABASE_URL:https://wakgzrzchmqdqyrgxlaq.supabase.co}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:medical-documents}
supabase.enabled=${SUPABASE_ENABLED:true}


# Google Gemini Direct AI Gateway Configuration (Priority 1)
app.ai.gemini.enabled=true
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=gemini-3.6-flash
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# OpenRouter Free-Tier AI Gateway Configuration (Priority 2 Fallback)
app.ai.openrouter.base-url=https://openrouter.ai/api/v1
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.models=inclusionai/ling-3.0-flash-sante:free,nex-agi/nex-n2.5-mini:free,openrouter/free
app.ai.openrouter.vision-models=inclusionai/ling-3.0-flash-vl:free,nex-agi/nex-n2.5-pro:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
app.ai.openrouter.enabled=true

# Multi-Page Medical PDF Scanning (Up to 10 pages)
app.pdf.max-pages=10

# File Upload Size Restrictions (Anti-Storage Exhaustion & PDF Decompression Bomb Protection)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.max-file-size-bytes=10485760
# Thoi gian song signed URL xem tep y te (giay) - bucket Supabase PRIVATE
app.storage.signed-url-ttl-seconds=${APP_STORAGE_SIGNED_URL_TTL_SECONDS:900}

# Pluggable Payment Gateway & Stripe Sandbox Configuration
app.payment.stripe.enabled=true
app.payment.stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_mock_sandbox_key_mediassist_2026}
app.payment.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_mock_sandbox_key_mediassist_2026}
app.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_mock_sandbox_secret}
app.payment.stripe.currency=vnd
app.payment.client-base-url=${app.client-base-url}

# Frontend base URL - dung de dung link trong email (reset mat khau, xac thuc email, xem lich hen)
app.client-base-url=${APP_CLIENT_BASE_URL:http://localhost:5173}

# ===================================================================
# Email (SMTP) - dev: Mailpit (docker compose) | prod: SMTP_* env + STARTTLS
# ===================================================================
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:MediAssist AI <no-reply@mediassist.local>}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Thieu Mailpit/SMTP khong duoc lam /actuator/health bao DOWN
management.health.mail.enabled=false
# Thymeleaf chi dung render email (backend khong co MVC view)
spring.thymeleaf.check-template-location=false

# Google OAuth2 Client Configuration (Spring Security OAuth2 Login)
# Nap bien tu backend/.env (Spring Boot khong tu doc .env; chay tu thu muc backend/)
spring.config.import=optional:classpath:application-local.properties,optional:file:.env[.properties]
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id-here}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret-here}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google
app.oauth2.success-redirect-uri=${APP_OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:5173/oauth2/callback}
app.oauth2.failure-redirect-uri=${APP_OAUTH2_FAILURE_REDIRECT_URI:http://localhost:5173/login?error=oauth2_failed}
