# Supabase PostgreSQL (via Supabase Transaction Pooler or Direct)
# Transaction Pooler port 6543 (IPv4 compatible, optimal for local/cloud environments):
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres.wakgzrzchmqdqyrgxlaq}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Cache (Local Docker)
spring.data.redis.host=localhost
spring.data.redis.port=6379
