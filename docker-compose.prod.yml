version: '3.8'

# ==============================================================================
# MediAssist-AI Production Docker Orchestration (Milestone 7)
# Architecture: Zero-Downtime High-Load Stack with Nginx SSL Gateway
# ==============================================================================

services:
  # 1. PostgreSQL 16 with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mediassist_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026}
      POSTGRES_DB: ${DB_NAME:-mediassist_db}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mediassist_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediassist_internal

  # 2. Redis 7 Alpine (L2 Distributed Cache Layer)
  redis:
    image: redis:7-alpine
    container_name: mediassist_prod_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediassist_internal

  # 3. Spring Boot 3.4.x Enterprise Core Backend (Java 21 LTS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediassist_prod_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-mediassist_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 5001
      JWT_SECRET: ${JWT_SECRET:-MediAssistEnterpriseSuperSecretKey2026WithSufficientBitsForHMACSHA512Security}
      AI_GATEWAY_PROVIDER: ${AI_GATEWAY_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - prod_emr_uploads:/app/uploads
    networks:
      - mediassist_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5001/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. React 19 Frontend SPA (Vite + Tailwind Nginx Container)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediassist_prod_frontend
    restart: unless-stopped
    networks:
      - mediassist_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 5. Production Nginx Reverse Proxy & SSL Gateway (Public Facing Entrypoint)
  nginx-gateway:
    image: nginx:alpine
    container_name: mediassist_prod_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - prod_nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - mediassist_internal
      - mediassist_public

volumes:
  prod_postgres_data:
    name: mediassist_prod_postgres_data
  prod_redis_data:
    name: mediassist_prod_redis_data
  prod_emr_uploads:
    name: mediassist_prod_emr_uploads
  prod_nginx_logs:
    name: mediassist_prod_nginx_logs

networks:
  mediassist_internal:
    name: mediassist_internal_net
    internal: true
  mediassist_public:
    name: mediassist_public_net
    driver: bridge
