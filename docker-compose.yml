version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mediassist_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026}
      POSTGRES_DB: ${DB_NAME:-mediassist_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mediassist_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediassist_net

  redis:
    image: redis:7-alpine
    container_name: mediassist_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediassist_net

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: mediassist_pgweb
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_2026}@postgres:5432/${DB_NAME:-mediassist_db}?sslmode=disable
    depends_on:
      - postgres
    networks:
      - mediassist_net

volumes:
  postgres_data:
    name: mediassist_postgres_data
  redis_data:
    name: mediassist_redis_data

networks:
  mediassist_net:
    name: mediassist_network
    driver: bridge
